server:
  port: 0

# 공통 파일
# eureka 서버에게 질의하기 위해 필요하며, 모든 모듈에 공통으로 필요
# defaultZone: http://localhost:8761/eureka/ => eureka 서버의 위치정보 명시
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true
    # [수정] local.server.port 대신 server.port를 사용하면 Boot가 0번(동적포트) 요청 후 실제 포트를 자동 추적합니다.
    non-secure-port: ${server.port}
    # instance-id에 random.value를 조합하여 고유한 인스턴스로 Eureka에 등록합니다.
    instance-id: ${spring.application.name}:${random.value}
  
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  redis:
    host: localhost
    port: 6379
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/mydb
    username: root
    password: admin
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show_sql: true
  cloud:
    bus:
      enabled: true
    refresh:
      # busrefresh 시 Eureka Client 관련 빈이 파기되어 캔슬되는 현상 방지 (핵심!)
      extra-refreshable: none

