# 공통 파일
# eureka 서버에게 질의하기 위해 필요하며, 모든 모듈에 공통으로 필요
# defaultZone: http://localhost:8761/eureka/ => eureka 서버의 위치정보 명시
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # 1. 리프레시 시점에 값이 변하지 않도록 고유 UUID나 기존 인스턴스 ID를 유지시킵니다.
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${spring.application.instance_id:${random.uuid}}
    prefer-ip-address: true
    
    # 2. [★핵심] 유레카 서버 유효성 검사(400 에러)를 통과하기 위해 
    # 문자열 내부 파싱을 통해 런타임에 결정된 실제 톰캣 포트를 명시적으로 결합합니다.
    # 이렇게 하면 리프레시 시점에 0으로 초기화되는 것을 방지합니다.
    non-secure-port-enabled: true
    non-secure-port: ${spring.application.instance_id:${server.port}}

  client:
    # 3. 리프레시 직후 불완전한 상태로 하트비트를 보내는 것을 방지합니다.
    healthcheck:
      enabled: true

# 3307, admin, port 주의
server:
  # 0으로 세팅하면 spring이 임의 port를 할당(굳이 8081..등으로 관리할 필요없음)
  # eureka에 등록할 때 할당된 임의 port를 알려주고 apigate가 ureka에게 물어보므로 개발자가 port를 관리할 필요가 없다
  port: 0

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  redis:
    host: localhost
    port: 6379
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/mydb
    username: root
    password: admin
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show_sql: true
  cloud:
    bus:
      enabled: true

