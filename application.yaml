# 공통 파일
# eureka 서버에게 질의하기 위해 필요하며, 모든 모듈에 공통으로 필요
# defaultZone: http://localhost:8761/eureka/ => eureka 서버의 위치정보 명시
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # 0 대신 런타임에 할당된 실제 포트 번호를 유레카에 등록합니다.
    non-secure-port: ${spring.application.instance_id:${server.port:0}}
    # 유레카 인스턴스 ID가 중복되지 않도록 실제 포트를 포함시킵니다.
    instance-id: ${spring.cloud.client.hostname}:${spring.application.name}:${spring.application.instance_id:${random.value}}
    
# 3307, admin, port 주의
server:
  # 0으로 세팅하면 spring이 임의 port를 할당(굳이 8081..등으로 관리할 필요없음)
  # eureka에 등록할 때 할당된 임의 port를 알려주고 apigate가 ureka에게 물어보므로 개발자가 port를 관리할 필요가 없다
  port: 0

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  redis:
    host: localhost
    port: 6379
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/mydb
    username: root
    password: admin
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show_sql: true
  cloud:
    bus:
      enabled: true
