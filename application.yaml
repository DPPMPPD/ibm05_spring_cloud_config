server:
  port: 0

# 공통 파일
# eureka 서버에게 질의하기 위해 필요하며, 모든 모듈에 공통으로 필요
# defaultZone: http://localhost:8761/eureka/ => eureka 서버의 위치정보 명시
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true
    # [핵심] 랜덤 포트(port: 0) 사용 시 실제 바인딩된 포트를 Eureka에 넘겨주도록 설정
    non-secure-port-enabled: true
    non-secure-port: ${local.server.port}
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  redis:
    host: localhost
    port: 6379
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/mydb
    username: root
    password: admin
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show_sql: true
  cloud:
    bus:
      enabled: true
    refresh:
      # busrefresh 시 Eureka Client 관련 빈이 파기되어 캔슬되는 현상 방지 (핵심!)
      extra-refreshable: none

