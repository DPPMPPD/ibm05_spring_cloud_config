server:
  port: 0

# 공통 파일
# eureka 서버에게 질의하기 위해 필요하며, 모든 모듈에 공통으로 필요
# defaultZone: http://localhost:8761/eureka/ => eureka 서버의 위치정보 명시
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true
    # [수정] random.value로 인스턴스를 구분하면 Eureka가 내부적으로 실제 할당된 포트를 바인딩합니다.
    instance-id: ${spring.application.name}:${random.value}
  
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  redis:
    host: localhost
    port: 6379
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/mydb
    username: root
    password: admin
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show_sql: true
  cloud:
    bus:
      enabled: true
    refresh:
      # [핵심] Eureka Client 및 DB DataSource 빈이 busrefresh 시 파기되는 현상 완전 방지
      never-refreshable: >
        com.netflix.discovery.EurekaClient,
        org.springframework.cloud.netflix.eureka.serviceregistry.EurekaAutoServiceRegistration,
        javax.sql.DataSource,
        com.zaxxer.hikari.HikariDataSource
