# 공통 파일
# eureka 서버에게 질의하기 위해 필요하며, 모든 모듈에 공통으로 필요
# defaultZone: http://localhost:8761/eureka/ => eureka 서버의 위치정보 명시
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
     # 1. ⚠️ 에러를 유발하는 non-secure-port 라인은 완전히 삭제하거나 주석 처리하세요.
    # non-secure-port: ${local.server.port}  <-- 삭제

    # 2. 대신 instance-id를 아래와 같이 변경합니다.
    # server.port를 문자열 포맷 안에서 호출하면, 최초 구동 시 0이더라도 유레카 등록 시점에 실제 포트로 치환됩니다.
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    
    # 3. IP 주소 기반으로 유레카에 등록하도록 설정 (안정성 확보)
    prefer-ip-address: true

# 3307, admin, port 주의
server:
  # 0으로 세팅하면 spring이 임의 port를 할당(굳이 8081..등으로 관리할 필요없음)
  # eureka에 등록할 때 할당된 임의 port를 알려주고 apigate가 ureka에게 물어보므로 개발자가 port를 관리할 필요가 없다
  port: 0

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  redis:
    host: localhost
    port: 6379
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/mydb
    username: root
    password: admin
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show_sql: true
  cloud:
    bus:
      enabled: true

